<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" viewBox="0 0 720 274" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Where a merge's cost goes</title><desc>Implementers: $475 (71%); Designers: $95 (14%); Testers: $77 (11%); Critics: $20 (3%); Helpers: $2 (0%)</desc><rect x="0.5" y="0.5" width="719" height="273" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="24.0" y="36.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start">Where a merge's cost goes</text><text x="24.0" y="58.0" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">By agent role, at API prices, for the 59 merges whose cost is traced to every agent ($670)</text><text x="132.0" y="103.0" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">Implementers</text><path d="M144.0,88.0 H582.0 Q586.0,88.0 586.0,92.0 V104.0 Q586.0,108.0 582.0,108.0 H144.0 Z" fill="#2a78d6"/><text x="594.0" y="103.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">$475 · 71%</text><text x="132.0" y="137.0" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">Designers</text><path d="M144.0,122.0 H228.3 Q232.3,122.0 232.3,126.0 V138.0 Q232.3,142.0 228.3,142.0 H144.0 Z" fill="#2a78d6"/><text x="240.3" y="137.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">$95 · 14%</text><text x="132.0" y="171.0" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">Testers</text><path d="M144.0,156.0 H211.5 Q215.5,156.0 215.5,160.0 V172.0 Q215.5,176.0 211.5,176.0 H144.0 Z" fill="#2a78d6"/><text x="223.5" y="171.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">$77 · 11%</text><text x="132.0" y="205.0" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">Critics</text><path d="M144.0,190.0 H159.0 Q163.0,190.0 163.0,194.0 V206.0 Q163.0,210.0 159.0,210.0 H144.0 Z" fill="#2a78d6"/><text x="171.0" y="205.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">$20 · 3%</text><text x="132.0" y="239.0" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="end">Helpers</text><path d="M144.0,224.0 H144.0 Q146.0,224.0 146.0,226.0 V242.0 Q146.0,244.0 144.0,244.0 H144.0 Z" fill="#2a78d6"/><text x="154.0" y="239.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">$2 · under 1%</text></svg>
