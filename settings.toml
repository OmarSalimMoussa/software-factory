# Every value the factory uses. These are the defaults; the owner overrides any of them on the
# dashboard with the 6-digit code, which commits this file and reloads only what reads the change.

[repo]                  # the one product repo the factory works on
path = ""               # required: the factory's own checkout of the product, owned by software-agent
default_branch = "master"
github = ""             # required: owner/name of the product on GitHub
protected_paths = []    # the product's extra paths only a person changes; a trailing / names a folder. GOAL.md,
                        # goal/, .git, check-values/surfaces.toml, .github/workflows/, .github/factory-ref,
                        # factory.toml and every script factory.toml names always are

[models]                # model and effort for every role
allowed = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
efforts = ["low", "medium", "high", "xhigh"]
orchestrator = { model = "claude-opus-5-5", effort = "high" }
designer = { model = "claude-opus-5-5", effort = "high" }
implementer_large = { model = "claude-opus-5-5", effort = "high" }
implementer_small = { model = "claude-sonnet-5-5", effort = "high" }
intake = { model = "claude-sonnet-5-5", effort = "medium" }
triage = { model = "claude-sonnet-5-5", effort = "medium" }
critic = { model = "claude-sonnet-5-5", effort = "medium" }
qa_backend = { model = "claude-sonnet-5-5", effort = "medium" }
qa_security = { model = "claude-sonnet-5-5", effort = "medium" }
qa_ux = { model = "claude-sonnet-5-5", effort = "medium" }
qa_visual = { model = "claude-sonnet-5-5", effort = "medium" }
qa_ui_function = { model = "claude-haiku-5-5", effort = "high" }
qa_regression = { model = "claude-haiku-5-5", effort = "high" }
qa_prod = { model = "claude-haiku-5-5", effort = "high" }

[caps]
implementers = 3
designers = 2
subagents_at_once = 4
browsers_at_once = 4    # browser testers on the whole machine at once: each one is a browser in the slice's memory

[subagents]             # which subagent kinds each role may start
browser_personas = ["qa-ui-function", "qa-ux", "qa-visual", "qa-regression", "qa-prod"]
orchestrator = ["intake", "triage", "qa-regression", "qa-prod", "Explore"]
designer = ["critic-architecture", "critic-product", "critic-reliability", "critic-security", "critic-ux", "Explore"]
implementer = ["qa-backend", "qa-security", "qa-ui-function", "qa-ux", "qa-visual", "Explore"]
unpermitted = ["Explore"]

[rounds]
qa = 4
critic = 4
check_runs = 3
extend_by = 2

[qa]
seconds_per_item = 120
max_items = 10
desktop_seconds = 300
evidence_days = 14
widths = [1440, 1024, 390]
quiet_seconds = 120     # a tester with no result stops holding a place after this much quiet, its budget spent
stale_seconds = 300     # or after this much quiet, whatever its budget
screenshots_for_owner_only = ["qa-prod"]
viewport_height = 900   # a tester browser's height; its width is the first of widths
max_steps = 6           # numbered steps a standing scenario may have; one scenario fits seconds_per_item
prod_every_hours = 24   # the warden asks for a read-only walk of prod this long after the last one

[intake]                # see the intake spec
batch_size = 100
batch_max_wait_hours = 6
fast_lane_minutes = 20
weights = { severity = 40, goal = 30, requests = 15, users = 10, age = 5 }
minor_severity = 0.4    # a minor task's severity part; a major one counts 1
requests_full = 20      # requests gathered at which that part reaches 1
users_full = 10         # distinct users at which that part reaches 1
age_full_days = 14      # age at which that part reaches 1
rescore_hours = 6       # every waiting task is scored again together this often, so their age parts stay alike

[routing]               # see the routing spec
small_max_slices = 1
large_max_slices = 3
max_proposals = 3       # open proposals on the dashboard at once
estimate_min_runs = 5   # runs at a rung before its estimate is shown; unknown until then
estimate_window = 20    # the estimate is the median of the last this-many runs at the rung
cause_tries = 3         # tries to confirm a cause before an implementer asks for a higher rung

[slots]
count = 3
port_base = 8100
log_tail_lines = 40     # lines of scripts/dev output an agent sees, secrets redacted
api_timeout_seconds = 30  # one call to a slot's API or health address
api_max_kib = 256       # the largest slot API answer a session sees
verb_minutes = 30       # the longest one scripts/dev verb may run before it is stopped

[budget]
slice_memory_high = "11G"
slice_memory_max = "12G"
slice_cpu_weight = 50
test_memory_ceiling_mib = 6656
test_reserve_mib = 4096

[vitals]
memory_amber_gib = 8.0
memory_red_gib = 4.0
cpu_pressure_amber = 60.0
battery_red = 15
firewall_stale_seconds = 180  # the firewall loaded longer ago than this is red: every start waits

[watch]
tick_seconds = 15
probe_seconds = 60
outage_after = 2        # failed prod probes in a row that count as an outage
http_timeout_seconds = 10  # a probe or a GitHub call that takes longer has timed out
inbox_wait_seconds = 50    # `factory inbox --wait` asks again after this much quiet
push_wait_minutes = 30     # a push to prod that has not answered on the new build by then has failed
deploy_minutes = 30     # how long staging's deploy of a push may take: its restart is no red staging until then
ci_poll_minutes = 1     # how often the warden asks GitHub about CI's run of its last push, until it ends
branch_retry_minutes = 5  # how often the warden asks again whether a deployed build is on the default branch
resume_tries = 2        # a crashed session is retired after this many failed resumes within the crash window
crash_window_minutes = 60  # crashes further apart than this count afresh
resume_backoff_seconds = 30  # the wait before a crashed session's next resume, doubling with each one in the window
daemon_settle_seconds = 15  # how long the agent's Claude daemon gets, once it starts, before sessions resume in it
bench_grace_seconds = 60  # time a pushed-out session gets to commit before it pauses
start_grace_seconds = 120  # a started session that has not appeared by then is retired as crashed
reap_retry_minutes = 10  # a reap that could not empty a retired session's slot is tried again after this
message_seconds = 10    # how long the warden holds the owner's message out to a session before letting go
loop_minutes = 30
orchestrator_silent_minutes = 40
orchestrator_busy_silent_minutes = 120
refusals_to_notify = 5
refusal_window_minutes = 60  # the window for refusals_to_notify
socket_read_seconds = 10  # a caller that has not sent its request line by then is dropped

[cost]
daily_budget_usd = 150  # at API prices (an estimate on a subscription): past it, only severe work starts that day
plan_stale_minutes = 45 # an older plan-limit reading shows as unknown
plan_amber_percent = 80
plan_red_percent = 95

[prices]                # dollars per million tokens, per allowed model; a model without one costs "unknown"
# Anthropic's API list prices (claude.com/pricing), cache writes at the 5-minute rate; Haiku's for prompts to 100k tokens
claude-opus-5-5 = { input = 4, output = 20, cache_read = 0.2, cache_write = 5 }
claude-sonnet-5-5 = { input = 2, output = 10, cache_read = 0.1, cache_write = 2.5 }
claude-haiku-5-5 = { input = 0.1, output = 0.5, cache_read = 0.01, cache_write = 0.125 }

[checks]                # `factory check`, which the warden runs in its own unit
run_minutes = 30        # the longest one check may run before it is stopped
test_seconds = 45       # the longest one test may run: scripts/dev test gets it as FACTORY_TEST_SECONDS
output_kib = 64         # the most of a check's report a session sees; the end is kept

[queue]
max_upload_kib = 512    # a picture, spec or triage plan sent with a factory command

[errors]                # prod's and staging's unresolved GlitchTip issues, filed as requests from glitchtip
poll_minutes = 5        # how often the warden reads them
max_pages = 5           # pages of issues one read covers, newest first
severe_events = 100     # an issue seen this many times is severe and goes to intake at once, as a fatal one does

[reports]               # the users' reports, from the product's optional scripts/dev reports verb
poll_minutes = 10       # how often the warden asks for new ones

[telemetry]             # `factory errors` and `factory traces`: agents read GlitchTip and Langfuse through the warden
max_items = 20          # issues or traces one answer lists
max_kib = 64            # the largest answer an agent gets; longer lists and texts are cut to fit
timeout_seconds = 20    # one call to GlitchTip or Langfuse

[reflect]
fold_hours = 24         # the same kind and text within this window bumps a count instead of a new entry
max_chars = 600         # the longest reflection an agent may write

[sandbox]
allowed_domains = ["pypi.org", "files.pythonhosted.org", "registry.npmjs.org"]
writable_caches = [".cache/uv", ".npm"]  # folders in the agent's home a session may write: its tools' caches

[dashboard]
port = 8300
refresh_seconds = 15
stale_seconds = 45      # data older than this is marked old
page_margin_seconds = 5 # a page waits this much longer than the dashboard waits for the warden before giving up
wrong_codes_to_lock = 5
lock_minutes = 60       # how long coded actions stay locked; Pause and Stop are never locked
device_days = 30        # how long a device stays admitted after one code
hosts = ["127.0.0.1", "localhost"]  # Host and Origin the dashboard answers; the installer adds the tailnet name
page_size = 50
probe_strip = 10        # probes the outage band shows
working_now_max = 6
max_threads = 16
retired_linger_minutes = 3  # a retired agent stays in the live tree this long, then moves to History
idempotency_hours = 24  # how long the answer to a write is kept for a retry with the same key
warden_seconds = 8      # the longest the dashboard waits for the warden's answer; the page gives up at 10
settled_seconds = 2     # how long a card the owner acted on says what happened before its place moves on
message_max_chars = 4000  # the longest message the owner sends a session
thread_messages = 10    # the owner's last messages a session's thread shows, each with the agent's reply
thread_tail_kib = 2048  # how much of the end of a transcript the thread reads

[gc]                    # the nightly prune; reaping a retired session is immediate
prune_hour = 3
images_keep_days = 7
docker_budget_gib = 60

[factory]
github = ""             # owner/name of the factory's own repo on GitHub, which it never works on; the installer sets it
command_seconds = 120   # how long the warden waits for one of its own commands (git, systemctl)
warden_threads = 16     # requests the warden answers at once, on each of its sockets

[install]               # read by the installer: a change takes effect at the next install
drill = { model = "claude-haiku-5-5", effort = "low" }  # the model the drills drive a sandboxed command with
drill_seconds = 180     # the longest one drill may run
drills_at_once = 4      # drill sessions run side by side, each in its own unit; the guard and host drills run alone
tailnet_seconds = 60    # how long publishing the dashboard on the tailnet may wait before the owner is shown why
hook_timeout_seconds = 10  # how long Claude Code waits for the guard, which decides within half of it or refuses
firewall_refresh_seconds = 60  # how often the firewall table is loaded again, should anything have flushed it
healthchecks_grace_minutes = 10  # how late a Healthchecks.io check-in may be before the owner is told
release_check_hours = 1  # how often the warden asks GitHub whether a newer factory release is ready
upgrade_wait_minutes = 40  # how long an upgrade waits for every paused agent to settle before it gives up
upgrade_minutes = 90    # the longest an upgrade may run before it is stopped
toolchain = ["uv", "node"]  # programs the product's scripts need, copied from the owner's PATH for the agents and stack
# The Claude Code versions the factory's readers of its internals were drilled with: the lowest, and the first that
# was not. Widen it only after the install's drills pass on the new version.
claude_lowest = "2.1.296"
claude_untested = "2.2.0"
