# Files that talk about the mirror phrases without declaring a mirror: the check's own phrase list, the rulebook
# sentence that defines the phrase, and the check's test fixtures. None of them is a hand-kept copy.
skip = ["checks/standard/patterns/mirror_markers.py", "rules/engineering.md", "tests/checks/test_checks_patterns.py"]
# No mirror is ever claimed: the factory keeps no mirrored constants, so any new "must mirror" note fails.
claims = []

[copies]
# Server vocabularies copied, undeclared, into the dashboard's browser code.
server = ["runtime/"]
web = ["runtime/dashboard/ui/"]
generated_markers = []
rows = []
