# The stack user's own systemd, where its rootless Docker runs every slot's and the shared services' containers,
# outside the factory's slice: the same kernel wall as the slice's, under the firewall table that something could
# flush. Nothing it runs reaches the tailnet, but Tailscale's own resolver.
[Service]
IPAddressDeny=100.64.0.0/10 fd7a:115c:a1e0::/48
IPAddressAllow=100.100.100.100 fd7a:115c:a1e0::53
