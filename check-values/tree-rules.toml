# The factory's own Python: its runtime, its checks, its standard build and deploy, and its plugin's hooks.
product_python = ["runtime", "checks", "standard", "plugin"]
# The factory serves its pages with the standard library and imports no HTTP framework.
service_frameworks = []
# No JavaScript barrel or index module stands in for the module that owns a symbol.
entrypoints = {}
# Every environment read is required, or optional by design without a default.
env_allow = {}

