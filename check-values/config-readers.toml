# The factory's config modules for its process environment: runtime/shared/environment.py for its own programs and
# standard/environment.py for the standard build and deploy commands, each the one reader of its family's variables.
# The factory's tuning lives in settings.toml and is read by runtime/shared/settings.py, never from the environment.
config_files = ["environment.py"]
readers = []
python_trees = ["runtime", "checks", "standard", "plugin"]
# The factory has no browser or Rust code that reads an environment.
script_trees = []
rust_trees = []
# The factory runs no compose service of its own whose keys this check could follow.
accessors = {}
optional = []
env_files = {}
services = []

[allow]
