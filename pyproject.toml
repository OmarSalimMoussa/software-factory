[project]
name = "software-factory"
version = "0.1.0"
description = "A frozen dev-workflow harness that runs Claude agents on one product repo"
requires-python = ">=3.12"
# The runtime and the standard build and deploy are standard-library Python. Only checks/ uses the pinned tools below.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.14.1",
  "import-linter==2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "runtime", "checks", "standard"]
pythonpath = ["."]  # contract: tests import runtime and checks from the repo root
python_files = ["test_*.py", "*_test.py"]
# The self-check runs only in CI, as its own step: a plain run leaves it out, and `-m self_check` selects it.
addopts = "-q -m 'not self_check'"
markers = ["self_check: the factory held to the standard checks it holds every product to; CI only"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C901", "PLR0911", "PLR0912", "PLR0915", "BLE001", "PGH003", "PGH004", "RUF100"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["runtime", "checks", "standard"]
