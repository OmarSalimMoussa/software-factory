# The factory's shared services: one stack per host, compose project factory-services.
#
# Postgres for the products' databases (one per workspace or slot), pgweb, GlitchTip and the edge. Every value that
# differs between hosts comes from services.env, which the server set-up writes (standard/services/stack.py).
# Container names and volume names are fixed: there is one of each per host, and the provisioner reaches
# factory-postgres and factory-glitchtip by name over each workspace's own network. Ports are published on 127.0.0.1
# only; the server serves them to its tailnet.
# Services reach each other by container name, never by service key: a workspace network a shared container joins
# could hold a product service with the same key.
# A healthcheck probes every 30s, and at a start's quick pace (start_interval) only within its start period: each probe
# starts a process in the container, and on one server beside prod and the slots that adds up to a real share of CPU.
name: factory-services

services:
  postgres:
    image: docker.io/postgres:17.10
    container_name: factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
    healthcheck:
      # Over TCP, not the socket: initdb's temporary server answers on the socket while TCP is still closed.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 30s
      timeout: 3s
      retries: 20
      start_period: 60s
      start_interval: 3s
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - factory-postgres-data:/var/lib/postgresql/data
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 2G

  pgweb:
    image: docker.io/sosedoff/pgweb:0.16.2
    container_name: factory-pgweb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # No login of its own: it answers on the loopback and the tailnet alone.
      PGWEB_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@factory-postgres:5432/postgres?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 256M

  # The image's web command does not migrate (it serves a healthy /_health/ against an empty database), so this
  # one-shot creates the schema first and exits 0; web and worker wait for it. It runs again on every `up`.
  glitchtip-migrate:
    image: docker.io/glitchtip/glitchtip:6.2.6
    container_name: factory-glitchtip-migrate
    restart: "no"
    command: ./bin/run-migrate.sh
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    environment: &glitchtip-env
      DATABASE_URL: postgres://postgres:${GLITCHTIP_POSTGRES_PASSWORD:?}@factory-glitchtip-postgres:5432/postgres
      VALKEY_URL: redis://factory-glitchtip-valkey:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:?}
      # Mail goes to the console; GlitchTip still checks the address, which must be on a real domain.
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:?}
      EMAIL_URL: consolemail://
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      GLITCHTIP_ENABLE_LOGS: "true"
      GLITCHTIP_ENABLE_MCP: "true"
      GLITCHTIP_RETENTION_DAYS: "90"
      GLITCHTIP_LOG_HOT_DAYS: "7"
      GLITCHTIP_ENABLE_DUCKDB: "true"
      GLITCHTIP_COLD_STORAGE_DIR: /cold
      PORT: "8000"
    volumes:
      - factory-glitchtip-cold:/cold
    networks:
      - glitchtip
    deploy:
      resources:
        limits:
          memory: 512M

  glitchtip:
    image: docker.io/glitchtip/glitchtip:6.2.6
    container_name: factory-glitchtip
    restart: unless-stopped
    command: ./bin/run-web.sh
    depends_on: &glitchtip-after-migrate
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    environment: *glitchtip-env
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 6
      # The first start migrates its databases, which is slow: failures in this window do not count, so a first
      # boot is never declared unhealthy halfway through.
      start_period: 600s
      start_interval: 10s
    ports:
      - "127.0.0.1:8200:8000"
    volumes:
      - factory-glitchtip-cold:/cold
    networks:
      - glitchtip
    deploy:
      resources:
        limits:
          memory: 512M

  glitchtip-worker:
    image: docker.io/glitchtip/glitchtip:6.2.6
    container_name: factory-glitchtip-worker
    restart: unless-stopped
    command: ./bin/run-worker.sh
    depends_on: *glitchtip-after-migrate
    environment: *glitchtip-env
    volumes:
      - factory-glitchtip-cold:/cold
    networks:
      - glitchtip
    deploy:
      resources:
        limits:
          memory: 256M

  glitchtip-postgres:
    image: docker.io/postgres:17.10
    container_name: factory-glitchtip-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    environment:
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 30s
      timeout: 3s
      retries: 20
      start_period: 60s
      start_interval: 3s
    volumes:
      - factory-glitchtip-postgres-data:/var/lib/postgresql/data
    networks:
      - glitchtip
    deploy:
      resources:
        limits:
          memory: 512M

  glitchtip-valkey:
    image: docker.io/valkey/valkey:8.1.3
    container_name: factory-glitchtip-valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 20
      start_period: 60s
      start_interval: 3s
    networks:
      - glitchtip
    deploy:
      resources:
        limits:
          memory: 64M

  # A server's front door: owns 80 and 443 for every workspace on the host, ends TLS and passes each host name to
  # that workspace's own loopback port through the site files deploys write.
  edge:
    image: docker.io/library/caddy:2.10.2-alpine
    container_name: factory-edge
    restart: unless-stopped
    network_mode: host
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/factory/edge/sites:/etc/caddy/sites:ro
      - factory-edge-data:/data
      - factory-edge-config:/config
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # Each set of datastores sits on its own network behind its one web service. A workspace reaches the shared
  # services only through the network the provisioner makes for it, never through these.
  data: {}
  glitchtip: {}

# Named for the host, not the compose project: the data belongs to the host's one stack.
volumes:
  factory-postgres-data:
    name: factory-postgres-data
  factory-glitchtip-postgres-data:
    name: factory-glitchtip-postgres-data
  factory-glitchtip-cold:
    name: factory-glitchtip-cold
  factory-edge-data:
    name: factory-edge-data
  factory-edge-config:
    name: factory-edge-config
