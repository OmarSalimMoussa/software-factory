# Every value the factory uses. These are the defaults; the owner overrides any of them on the
# dashboard with the 6-digit code, which commits this file and reloads only what reads the change.

[repo]                  # the one product repo the factory works on
path = ""               # required: the factory's own checkout of the product, owned by software-agent
default_branch = "master"
github = ""             # required: owner/name of the product on GitHub
protected_paths = []    # the product's extra paths only a person changes; a trailing / names a folder. GOAL.md,
                        # goal/, .git, check-values/surfaces.toml, factory.toml and every script factory.toml
                        # names always are

[models]                # model and effort for every role
allowed = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
efforts = ["low", "medium", "high", "xhigh"]
orchestrator = { model = "claude-opus-5-5", effort = "high" }
designer = { model = "claude-opus-5-5", effort = "high" }
implementer_large = { model = "claude-opus-5-5", effort = "high" }
implementer_small = { model = "claude-sonnet-5-5", effort = "high" }
intake = { model = "claude-sonnet-5-5", effort = "medium" }
triage = { model = "claude-sonnet-5-5", effort = "medium" }
critic = { model = "claude-sonnet-5-5", effort = "medium" }
qa_backend = { model = "claude-sonnet-5-5", effort = "medium" }
qa_security = { model = "claude-sonnet-5-5", effort = "medium" }
qa_ux = { model = "claude-sonnet-5-5", effort = "medium" }
qa_visual = { model = "claude-sonnet-5-5", effort = "medium" }
qa_ui_function = { model = "claude-haiku-5-5", effort = "high" }
qa_regression = { model = "claude-haiku-5-5", effort = "high" }
qa_prod = { model = "claude-haiku-5-5", effort = "high" }

[caps]
implementers = 3
designers = 2
subagents_at_once = 4
browsers_at_once = 4    # browser testers on the whole machine at once: each one is a browser in the slice's memory
desktops_at_once = 2    # desktop testers on the whole machine at once: a desktop's live view needs spare CPU, so a
                        # desktop walk runs alone and a second comes only from a tester already walking

[subagents]             # which subagent kinds each role may start
browser_personas = ["qa-ui-function", "qa-ux", "qa-visual", "qa-regression", "qa-prod"]
orchestrator = ["intake", "triage", "qa-regression", "qa-prod", "Explore"]
designer = ["critic-architecture", "critic-product", "critic-reliability", "critic-security", "critic-ux", "Explore"]
implementer = ["qa-backend", "qa-security", "qa-ui-function", "qa-ux", "qa-visual", "Explore"]
unpermitted = ["Explore"]

[rounds]
qa = 4
critic = 4
check_runs = 3
extend_by = 2
bundle_merges = 5       # merges one check of the default branch clears together; no merge turn goes past it
revert_fails = 2        # a bundle names a merge for a revert once this many walks with it in failed a scenario

[qa]
seconds_per_item = 120
setup_seconds = 180     # added once to each tester's time, for its start-up and sign-in
max_items = 10
desktop_seconds = 300
desktop_wait_minutes = 5  # a tester's desktop up waits this long in all, on the factory's time, for a desktop to
                          # free, or it is refused, then for the other browser walks to hand back, or it goes ahead:
                          # it and desktop up's own minutes fit one shell call's longest wait
keep_bundles = 5        # the QA evidence and runs of the newest this many merge bundles are kept, the rest cleaned up
widths = [1440, 1024, 390]
quiet_seconds = 120     # a tester with no result stops holding a place after this much quiet, its budget spent
stale_seconds = 300     # or after this much quiet, whatever its budget
screenshots_for_owner_only = ["qa-prod"]
viewport_height = 900   # a tester browser's height; its width is the first of widths
browser_permissions = ["clipboard-read", "clipboard-write"]  # what a tester browser lets every page use: a
                        # paste is walked as a person makes it
max_steps = 6           # numbered steps a standing scenario may have for each item it takes (its items: label, or
                        # one), so its walk fits its items' seconds_per_item
prod_every_hours = 24   # the warden asks for a read-only walk of prod this long after the last one
desktop_viewport = [1280, 800]  # a desktop tester's browser, at the desktop's own size: its screenshots are not shrunk
wait_reload_seconds = 60  # a tester's wait reloads the page this often
key_delay_ms = 50       # the pause between the keys browser_type_keys sends: the remote desktop drops faster ones
hold_max_seconds = 120  # the longest browser_hold_request holds a request: each browser call takes seconds, and
                        # a step may need several, such as a click and its confirm, before its release
click_hold_ms = 150     # how long browser_mouse_press_xy holds the button: a remote desktop under load misses shorter clicks
press_settle_ms = 250   # how long browser_mouse_press_xy rests on its point first: a press with its move may miss
place_turn_seconds = 120  # a freed browser place waits this long for the session told of it, then the next is told
wait_max_minutes = 15   # the longest one wait may last
browser_answer_seconds = 120  # the longest the browser has to answer one call, a browser_wait_for's own time aside
browser_answer_chars = 50000  # the longest text one browser answer gives, under Claude Code's cap on a tool's answer

[replay]                # how a tester's run is replayed: the builder's timings, then the player's pace
long_wait_seconds = 4.0     # a wait longer than this shows only its end
wait_tail_seconds = 2.5     # the end a long wait shows
navigation_tail_seconds = 1.5  # a page change shows this long before it arrived: it may have queued behind a wait
freeze_ms = 120         # before a click or a keystroke the replay pauses this early, three frames, so the picture shows it undone
secret_seconds = 15     # after a sign-in link or the desktop's password is typed, the picture is hidden this long
recorder_before_seconds = 0.05  # the page recorder's line for a call may come this early: the clocks differ a little
recorder_after_seconds = 0.3    # and this late: a click lands after its call is sent, and its line is written after
desktop_view_share = 0.3  # a field taking more of the screen than this is a desktop's live view, which takes all keys
read_part_share = 0.6   # an element a tester's script looked up is a part of the page when it takes less than this
card_ms = 1800          # a step's title card
fade_ms = 400           # a bubble or a tag fading out; shorter than between_ms
between_ms = 600        # the pause between two actions
char_ms = 50            # a thought types out a character this often
read_ms = 2400          # a thought stays this long once typed
glide_ms = 1500         # the cursor gliding to a click
before_ms = 400         # a tag shows this long before the screen moves
after_ms = 1000         # the screen rests this long after it moved
miss_ms = 2800          # a failed action's tag stays this long
type_char_ms = 120      # typed text shows a character this often
type_lead_ms = 300      # the typing tag shows empty this long before the first character
type_rest_ms = 600      # and stays this long after the last, before it says what was typed
pill_ms = 2000          # an action with nothing to play shows its tag this long
shot_ms = 1800          # a screenshot's flash and tag

[intake]                # see the intake spec
batch_size = 100
batch_max_wait_hours = 6
fast_lane_minutes = 20
weights = { severity = 40, goal = 30, requests = 15, users = 10, age = 5 }
minor_severity = 0.4    # a minor task's severity part; a major one counts 1
requests_full = 20      # requests gathered at which that part reaches 1
users_full = 10         # distinct users at which that part reaches 1
age_full_days = 14      # age at which that part reaches 1
rescore_hours = 6       # every waiting task is scored again together this often, so their age parts stay alike

[routing]               # see the routing spec
small_max_slices = 1
large_max_slices = 3
max_proposals = 3       # open proposals on the dashboard at once
estimate_min_runs = 5   # runs at a rung before its estimate is shown; unknown until then
estimate_window = 20    # the estimate is the median of the last this-many runs at the rung
cause_tries = 3         # tries to confirm a cause before an implementer asks for a higher rung

[slots]
count = 3
port_base = 8100
log_tail_lines = 40     # lines of scripts/dev output an agent sees
wake_note_minutes = 10  # a slot command that fails this soon after the laptop wakes says so
api_timeout_seconds = 30  # one call to a slot's API or health address
api_max_kib = 256       # the largest slot API answer a session sees
verb_minutes = 30       # the longest one scripts/dev verb may run before it is stopped
run_seconds = 300       # the longest `factory slot run` may take; its service is built first with `factory slot up`
tail_max_kib = 64       # the most of one slot command's output an agent sees
cpu_shares = 64         # each slot container's share of the CPU against prod's 1024, set as it starts
same_up_minutes = 240   # an up that would change nothing is skipped this long after the last good one; 0: never
owner_address = ""      # the test address Open on the Done tab signs you in to slot 0 as; empty: the button waits
zero_origin = ""        # where staging (slot 0) opens to the world, http://<the box's IPv4>:<port>; empty: loopback
keys_from = ""          # the owner's env file slots take keys from, set at install; empty: the template's values
keys = []               # the keys copied from it into every slot before each stack command, such as a model's key

[budget]
slice_memory_high = "11G"
slice_memory_max = "12G"
slice_cpu_weight = 50
cpu_target_percent = 55.0  # the machine's average CPU use the factory keeps to, % of all CPUs: under a host's baseline
                           # (60% on a VPS that meters CPU on credits), less what the host counts and the machine misses
cpu_floor_percent = 15.0   # the least of all CPUs the factory's slice keeps, however busy the rest of the machine is
cpu_window_seconds = 300   # how far back the CPU averages reach; a reading older than this is unknown
walk_hold_percent = 65.0   # past this average CPU use, or with it unknown, a new browser tester, or a session's own
                           # desktop, waits: what a walk starts runs outside the factory's slice and its CPU limit
walk_hold_minutes = 15     # a walk held this long starts anyway, so a busy machine never stalls a merge for good
test_memory_ceiling_mib = 6656
test_reserve_mib = 4096 # kept for every other session: as many checks run tests at once
                        # as fit under slice_memory_high after it, in test_memory_ceiling_mib each

[vitals]
memory_amber_gib = 8.0
memory_red_gib = 4.0
cpu_red_percent = 90.0  # the machine's average CPU use, % of all CPUs, past which nothing starts
battery_amber = 30
battery_red = 15
firewall_stale_seconds = 180  # the firewall loaded longer ago than this is red: every start waits
disk_amber_gib = 30     # free disk, on the fullest one the factory writes to, under which only severe work starts:
                        # about a day of the agents' busiest growth
disk_red_gib = 10       # under this nothing starts: prod shares the disk, and its database stops on a full one
merge_wait_amber_hours = 6  # a merge that waited longer for its check is amber: twice the three hours or so a
                            # check takes with a failed walk, its fix and a second walk

[watch]
tick_seconds = 15
probe_seconds = 60
outage_after = 2        # failed prod probes in a row that count as an outage
http_timeout_seconds = 10  # a probe or a GitHub call that takes longer has timed out
inbox_wait_seconds = 50    # `factory inbox --wait` asks again after this much quiet
push_wait_minutes = 30     # a push to prod that has not built, deployed and answered by then has failed
resume_tries = 2        # a crashed session is retired after this many failed resumes within the crash window
crash_window_minutes = 60  # crashes further apart than this count afresh
resume_backoff_seconds = 30  # the wait before a crashed session's next resume, doubling with each one in the window
daemon_settle_seconds = 15  # how long the agent's Claude daemon gets, once it starts, before sessions resume in it
bench_grace_seconds = 60  # time a pushed-out session gets to commit before it pauses
bench_min_run_minutes = 20  # a working run keeps its place this long before anything but severe work benches it
container_deaths_minutes = 5  # how often the warden counts the containers that stopped when nothing asked
failing_alarm_minutes = 30  # an import still failing after this long is reported as an error, once
done_minutes = 5        # how often the Done tab's list, and the commit slot 0 runs, are read
start_grace_seconds = 120  # a started session that has not appeared by then is retired as crashed
respawn_poll_seconds = 1  # how often the warden looks whether a session it respawned runs again
account_check_seconds = 180  # how long a switch of Claude accounts waits for the first agent back to answer
reap_retry_minutes = 10  # a reap that could not empty a retired session's slot is tried again after this
message_seconds = 10    # how long the warden holds the owner's message out to a session before letting go
stop_seconds = 5        # how long the message's delivery then gets to finish before it is stopped
loop_minutes = 30
orchestrator_silent_minutes = 40
orchestrator_busy_silent_minutes = 120
refusals_to_notify = 5  # one rule refusing one session this often files an incident; a wait never does
refusal_window_minutes = 60  # the window for refusals_to_notify
refusal_burst_seconds = 5  # refusals this close together are one attempt: one message's calls at once
socket_read_seconds = 10  # a caller that has not sent its request line by then is dropped

[cost]
daily_budget_usd = 150  # at API prices (an estimate on a subscription): past it, only severe work starts that day
plan_stale_minutes = 45 # an older plan-limit reading shows as unknown
plan_amber_percent = 80
plan_red_percent = 95

[prices]                # dollars per million tokens, per allowed model; a model without one costs "unknown"
# Anthropic's API list prices (claude.com/pricing). Cache writes at the 1-hour rate, the cache Claude Code writes;
# Haiku's prices are for prompts up to 100k tokens, and fast mode costs more: both read low here.
claude-opus-5-5 = { input = 4, output = 20, cache_read = 0.2, cache_write = 8 }
claude-sonnet-5-5 = { input = 2, output = 10, cache_read = 0.1, cache_write = 4 }
claude-haiku-5-5 = { input = 0.1, output = 0.5, cache_read = 0.01, cache_write = 0.2 }

[checks]                # `factory check`, which the warden runs in its own unit
run_minutes = 30        # the longest one check may run before it is stopped
place_wait_minutes = 30 # how long a check waits for room to run its tests before it is refused
test_seconds = 45       # the longest one test may run: scripts/dev test gets it as FACTORY_TEST_SECONDS
test_workers = 2        # test processes one run may use at once: scripts/dev test gets it as FACTORY_TEST_WORKERS
output_kib = 1024       # the most of a check's report a session sees; the end is kept. Claude Code keeps what
                        # passes its own limit in a file and gives the agent the path
writable_caches = [".cache/uv", ".npm"]  # folders in the agent's home a check may write: its tools' caches

[queue]
max_upload_kib = 512    # a picture, spec or triage plan sent with a factory command
max_brief_kib = 8192    # a designer's brief, one HTML page with its pictures inline

[errors]                # prod's and staging's (slot 0's) unresolved GlitchTip issues, filed as requests from glitchtip
poll_minutes = 5        # how often the warden reads them
max_pages = 5           # pages of a GlitchTip list one read covers: issues newest first, or the projects
severe_events = 100     # an issue seen this many times is severe and goes to intake at once, as a fatal one does

[reports]               # the users' reports: the warden reads prod's export, the product's optional verb sorts it
poll_minutes = 10       # how often the warden asks for new ones
fetch_seconds = 20      # how long prod's export may take to answer
max_mib = 8             # the largest export the warden takes; a larger one fails the pull until the export pages

[telemetry]             # `factory errors` and `logs`: agents read GlitchTip through the warden
max_items = 20          # issues or log lines one answer lists
max_kib = 64            # the largest answer an agent gets; longer lists and texts are cut to fit
timeout_seconds = 20    # one call to GlitchTip

[chat]                  # messages tagged in a chat become requests in the chat inbox, and the factory answers there
channels = []           # ids of the channels the warden reads, as text; none: it reads no chat
senders = []            # ids of the people and bots whose tags count, as text; none: anyone's in those channels
tag = "#factory"        # the word that files a message, in any case
poll_minutes = 1        # how often the warden reads the channels and answers on the requests filed from them
poll_pages = 5          # pages one read takes from a channel; the rest wait for the next read
page_messages = 50      # messages one call to the chat asks for
read_pages = 10         # pages of the chat the agents may read for one request
reply_chars = 200       # the most of a task's title, or of triage's reason, a reply in the chat carries
max_kib = 64            # the largest page of the chat an agent gets; longer texts are cut to fit
timeout_seconds = 20    # one call to the chat

[reflect]
fold_hours = 24         # the same kind and text within this window bumps a count instead of a new entry
max_chars = 600         # the longest reflection an agent may write
chart_days = 14         # the days the Self-reflect page counts new entries over

[dashboard]
port = 8300
refresh_seconds = 15
stale_seconds = 45      # data older than this is marked old
page_margin_seconds = 5 # a page waits this much longer than the dashboard waits for the warden before giving up
wrong_codes_to_lock = 5
lock_minutes = 60       # how long coded actions stay locked; Pause and Stop are never locked
device_days = 365       # how long a device, and so the MCP's token, stays admitted after one code
hosts = ["127.0.0.1", "localhost"]  # Host and Origin the dashboard answers; the box's edge serves each other name
page_size = 50
done_commits = 100      # commits the Done tab's Commits view lists
history_page_size = 10  # agents on one page of the Agents page's History
probe_strip = 10        # probes the outage band shows
working_now_max = 6
max_threads = 16
retired_linger_minutes = 3  # a retired agent stays in the live tree this long, then moves to History
idempotency_hours = 24  # how long the answer to a write is kept for a retry with the same key
warden_seconds = 8      # the longest the dashboard waits for the warden's answer; the page gives up at 10
settled_seconds = 2     # how long a card the owner acted on says what happened before its place moves on
message_max_chars = 4000  # the longest message the owner sends a session
thread_messages = 10    # the owner's last messages a session's thread shows, each with the agent's reply
thread_tail_kib = 2048  # how much of the end of a transcript the thread reads

[gc]                    # the clean-up; reaping a retired session is immediate
every_hours = 6         # how often it runs; each run then measures what fills the disk, for the disk vital's detail
images_keep_days = 7
build_cache_keep_hours = 48  # build cache unused this long goes; prod's own builds still find the recent cache
logs_keep_days = 14     # what each stack request printed is kept this long
docker_budget_gib = 60

[factory]
github = ""             # owner/name of the factory's own repo on GitHub, which it never works on; the installer sets it
command_seconds = 120   # how long the warden waits for one of its own commands (git, systemctl)
warden_threads = 16     # requests the warden answers at once, on each of its sockets

[install]               # read by the installer: a change takes effect at the next install
hook_timeout_seconds = 10  # how long Claude Code waits for the guard, which decides within half of it or refuses
mcp_start_seconds = 120  # how long Claude Code waits for an agent's MCP server, such as a tester's browser, to start
firewall_refresh_seconds = 60  # how often the firewall table is loaded again, should anything have flushed it
healthchecks_grace_minutes = 10  # how late a Healthchecks.io check-in may be before the owner is told
walk_wait_minutes = 30  # how long an upgrade holds new testers and waits for running ones to hand back, then pauses
upgrade_wait_minutes = 40  # how long an upgrade waits for every paused agent to settle before it gives up
upgrade_minutes = 90    # the longest an upgrade may run before it is stopped
toolchain = ["uv", "node"]  # programs the product's scripts need, copied from the owner's PATH for the agents and stack
