# The factory's CI, copied unchanged into a product's .github/workflows/: the deploy-shape check refuses a copy that
# differs by one byte. Every push is checked. A push to the default branch, or a run started by hand, is then built,
# smoke-tested and deployed to staging, all as the product's factory.toml says.
name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to put on staging; staging stays on it until the default branch is run
        required: true
        type: string

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    # A newer push to the same branch cancels these checks, and with them everything after them in the older run.
    concurrency:
      group: checks-${{ github.ref }}-${{ inputs.ref || 'push' }}
      cancel-in-progress: true
    outputs:
      commit: ${{ steps.factory.outputs.commit }}
      factory_repo: ${{ steps.factory.outputs.repo }}
      factory_sha: ${{ steps.factory.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: product
          persist-credentials: false
      - name: Read the factory commit the product pins
        id: factory
        run: |
          ref="$(cat product/.github/factory-ref)"
          if [[ ! "$ref" =~ ^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([0-9a-f]{40})$ ]]; then
            echo "::error::.github/factory-ref must hold one line: owner/name@<40-character sha>"
            exit 1
          fi
          {
            echo "repo=${BASH_REMATCH[1]}"
            echo "sha=${BASH_REMATCH[2]}"
            echo "commit=$(git -C product rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.factory.outputs.repo }}
          ref: ${{ steps.factory.outputs.sha }}
          ssh-key: ${{ secrets.FACTORY_READ_KEY }}
          persist-credentials: false
          path: factory
      - uses: astral-sh/setup-uv@v10
      - name: Install the factory's pinned tools
        working-directory: factory
        run: uv sync --frozen --extra dev --no-install-project
      # The product's tests, which the checks run, may need Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run the factory's checks
        working-directory: product
        env:
          CI: "true"
          PYTHONPATH: ${{ github.workspace }}/factory
        # -P keeps the product's root off the import path, so no product folder can stand in for the factory's code.
        run: ../factory/.venv/bin/python -P -m checks.runner --all

  # Every job below starts from this one, so none runs for a push to any other branch.
  plan:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ needs.checks.outputs.commit }}
      factory_repo: ${{ needs.checks.outputs.factory_repo }}
      factory_sha: ${{ needs.checks.outputs.factory_sha }}
      base: ${{ steps.plan.outputs.base }}
      derived: ${{ steps.plan.outputs.derived }}
      has_derived: ${{ steps.plan.outputs.has_derived }}
      short: ${{ steps.plan.outputs.short }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.checks.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.checks.outputs.factory_repo }}
          ref: ${{ needs.checks.outputs.factory_sha }}
          ssh-key: ${{ secrets.FACTORY_READ_KEY }}
          persist-credentials: false
          path: factory
      - name: Plan the images
        id: plan
        env:
          COMMIT: ${{ needs.checks.outputs.commit }}
          FACTORY_COMMIT: ${{ needs.checks.outputs.factory_sha }}
          PYTHONPATH: ${{ github.workspace }}/factory
        run: |
          python3 -P -m standard.plan --repo . --commit "$COMMIT" --factory-commit "$FACTORY_COMMIT" \
            --out "$RUNNER_TEMP/plan.json" --github-output

  build:
    needs: plan
    name: build ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.base) }}
    steps: &build-steps
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Spell the build arguments
        id: args
        env:
          ARGS: ${{ toJSON(matrix.image.args) }}
        run: |
          python3 - <<'PY'
          import json, os, secrets
          mark = f"ARGS_{secrets.token_hex(8)}"
          lines = "".join(f"{key}={value}\n" for key, value in json.loads(os.environ["ARGS"]).items())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"lines<<{mark}\n{lines}{mark}\n")
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          build-args: ${{ steps.args.outputs.lines }}
          push: true
          tags: ${{ matrix.image.ref }}:${{ needs.plan.outputs.short }}
          cache-from: type=registry,ref=${{ matrix.image.ref }}:buildcache
          cache-to: type=registry,ref=${{ matrix.image.ref }}:buildcache,mode=max

  # Images built FROM another image of this same commit, so only once that one is pushed.
  build-derived:
    needs: [plan, build]
    if: needs.plan.outputs.has_derived == 'true'
    name: build ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.derived) }}
    steps: *build-steps

  # The files a deploy needs on the server, with the plan, as one image: the server pulls it and builds nothing.
  deploy-image:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.factory_repo }}
          ref: ${{ needs.plan.outputs.factory_sha }}
          ssh-key: ${{ secrets.FACTORY_READ_KEY }}
          persist-credentials: false
          path: factory
      - name: Gather the deploy files
        id: stage
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
          FACTORY_COMMIT: ${{ needs.plan.outputs.factory_sha }}
          PYTHONPATH: ${{ github.workspace }}/factory
        run: |
          python3 -P -m standard.plan --repo . --commit "$COMMIT" --factory-commit "$FACTORY_COMMIT" \
            --out "$RUNNER_TEMP/plan.json"
          python3 -P -m standard.deploy_image --repo . --plan "$RUNNER_TEMP/plan.json" --out "$RUNNER_TEMP/deploy-image"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "plan.json")) as f:
              plan = json.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"ref={plan['registry']}/{plan['product']}-deploy\n")
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/deploy-image
          file: ${{ runner.temp }}/deploy-image/Dockerfile
          push: true
          tags: ${{ steps.stage.outputs.ref }}:${{ needs.plan.outputs.short }}

  smoke:
    needs: [plan, build, build-derived, deploy-image]
    # build-derived is skipped when nothing derives; a plain `needs` would then skip this job too.
    if: >-
      ${{ !failure() && !cancelled() && needs.build.result == 'success' && needs.deploy-image.result == 'success'
      && (needs.build-derived.result == 'success' || needs.build-derived.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.plan.outputs.factory_repo }}
          ref: ${{ needs.plan.outputs.factory_sha }}
          ssh-key: ${{ secrets.FACTORY_READ_KEY }}
          persist-credentials: false
          path: factory
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start this commit's images as a scratch stack and test them
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
          PYTHONPATH: ${{ github.workspace }}/factory
        run: python3 -P -m standard.smoke --repo . --commit "$COMMIT"

  deploy-staging:
    needs: [plan, smoke]
    if: ${{ !failure() && !cancelled() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-24.04
    # One staging deploy at a time, never cancelled half way; a newer waiting one replaces an older waiting one. Prod
    # has its own group, so a staging deploy never replaces a waiting prod deploy; the server's lock runs the two one
    # at a time.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          sparse-checkout: factory.toml
          sparse-checkout-cone-mode: false
      - name: Deploy staging
        env:
          SERVER_DEPLOY_KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHORT: ${{ needs.plan.outputs.short }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          test -n "$SERVER_DEPLOY_KEY" || { echo "::error::the secret SERVER_DEPLOY_KEY is not set"; exit 1; }
          # A push deploys only while it is still the default branch's newest commit: an older run that reaches this
          # job late never takes staging back. The newer commit's own run deploys it.
          if [ "$EVENT" != workflow_dispatch ]; then
            tip="$(python3 - <<'PY'
          import json, os, urllib.request
          url = f"{os.environ['API']}/repos/{os.environ['REPO']}/git/ref/heads/{os.environ['DEFAULT_BRANCH']}"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['REGISTRY_TOKEN']}",
                                                         "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=30) as reply:
              print(json.load(reply)["object"]["sha"])
          PY
          )"
            if [ "$tip" != "$COMMIT" ]; then
              echo "::notice::$DEFAULT_BRANCH is at ${tip:0:8} now, newer than ${COMMIT:0:8}; that commit's run deploys staging"
              exit 0
            fi
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_DEPLOY_KEY" > ~/.ssh/deploy
          host="$(python3 - <<'PY'
          import os, tomllib
          with open("factory.toml", "rb") as f:
              server = tomllib.load(f)["server"]
          with open(os.path.expanduser("~/.ssh/known_hosts"), "w") as out:
              out.write(f"{server['host']} {server['host_key']}\n")
          print(server["host"])
          PY
          )"
          # A push follows the default branch unless staging is pinned; a run by hand pins its ref, and running the
          # default branch by hand lifts the pin.
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" = "$DEFAULT_BRANCH" ]; then mode="pin -"; else mode="pin $REF"; fi
          else
            mode="follow"
          fi
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ServerAliveInterval=30 \
            "ci@$host" "deploy staging $SHORT $mode"
