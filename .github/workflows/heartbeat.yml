# Reusable: prod's check-in with Healthchecks.io, off the laptop. It pings only after prod's health address answers,
# so silence tells the owner. The product's own workflow holds the schedule, every install.heartbeat_minutes.
name: heartbeat

on:
  workflow_call:
    inputs:
      prod-health:
        description: Prod's health address
        required: true
        type: string
      max-seconds:
        description: How long each request may take
        required: true
        type: number
    secrets:
      HEALTHCHECKS_PROD_PING:
        description: Prod's Healthchecks.io ping address, which the factory's installer sets
        required: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Prod answers, then check in
        env:
          HEALTH: ${{ inputs.prod-health }}
          MAX: ${{ inputs.max-seconds }}
          PING: ${{ secrets.HEALTHCHECKS_PROD_PING }}
        run: |
          test -n "$PING" || { echo "::error::the secret HEALTHCHECKS_PROD_PING is not set"; exit 1; }
          curl -fsS -m "$MAX" -o /dev/null "$HEALTH"
          curl -fsS -m "$MAX" -o /dev/null "$PING"
