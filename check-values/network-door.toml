# Every outbound link goes through a door that sets its deadline and its redirect and proxy policy.

[[doors]]
name = "factory HTTP"
scans = ["runtime/"]
suffixes = [".py"]
calls = [
  '\burllib\.request\.urlopen\b',
  '\bbuild_opener\(',
  '^\s*from\s+urllib\.request\s+import\b',
  '\bhttp\.client\.HTTPS?Connection\(',
  '\bsocket\.create_connection\(',
  '^\s*(import|from)\s+(requests|httpx|aiohttp|urllib3)\b',
]
unless = []
owners = ["runtime/shared/network.py"]
code_only = true
remedy = "send it through runtime/shared/network.py's call, which sets the deadline and the redirect and proxy policy"

[doors.allow]

[[doors]]
name = "standard HTTP"
scans = ["standard/"]
suffixes = [".py"]
calls = [
  '\burllib\.request\.urlopen\b',
  '\bbuild_opener\(',
  '^\s*from\s+urllib\.request\s+import\b',
  '\bhttp\.client\.HTTPS?Connection\(',
  '\bsocket\.create_connection\(',
  '^\s*(import|from)\s+(requests|httpx|aiohttp|urllib3)\b',
]
unless = []
owners = ["standard/network.py"]
allow = {}
code_only = true
remedy = "send it through standard/network.py's call, which sets the deadline"

[[doors]]
name = "no links from the checks or the hooks"
scans = ["checks/", "plugin/"]
suffixes = [".py"]
calls = [
  '\burllib\.request\.urlopen\b',
  '\bbuild_opener\(',
  '^\s*from\s+urllib\.request\s+import\b',
  '\bhttp\.client\.HTTPS?Connection\(',
  '\bsocket\.create_connection\(',
  '^\s*(import|from)\s+(requests|httpx|aiohttp|urllib3)\b',
]
unless = []
owners = []
allow = {}
code_only = true
remedy = "the checks and the hooks reach nothing over the network: read what the repo or the warden already holds"

[[doors]]
name = "page links"
scans = ["runtime/dashboard/ui/"]
suffixes = [".js"]
calls = ['\bfetch\(', '\bnew\s+WebSocket\(', '\bnew\s+EventSource\(', '\bXMLHttpRequest\b', '\bsendBeacon\(']
unless = []
owners = ["runtime/dashboard/ui/js/core.js"]
allow = {}
code_only = true
remedy = "ask the page's server through core.js's api and post"
