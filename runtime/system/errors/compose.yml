# The factory's own GlitchTip: compose project factory-errors, on the laptop alone, apart from the shared services.
#
# Only the warden's and the dashboard's errors come here. No product's slot reaches it: it joins no workspace's
# network, and its address and key live in the factory-dsn secret only the warden and the dashboard read. Every value
# that differs between installs comes from errors.env, which the install writes (runtime/system/errors/instance.py).
name: factory-errors

services:
  # The image's web command does not migrate, so this one-shot creates the schema first and exits 0; web and worker
  # wait for it. It runs again on every `up`.
  migrate:
    image: docker.io/glitchtip/glitchtip:6.2.6
    container_name: factory-errors-migrate
    restart: "no"
    command: ./bin/run-migrate.sh
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment: &glitchtip-env
      DATABASE_URL: postgres://postgres:${ERRORS_POSTGRES_PASSWORD:?}@factory-errors-postgres:5432/postgres
      VALKEY_URL: redis://factory-errors-valkey:6379
      SECRET_KEY: ${ERRORS_SECRET_KEY:?}
      GLITCHTIP_DOMAIN: ${ERRORS_DOMAIN:?}
      # Mail goes to the console; GlitchTip still checks the address, which must be on a real domain.
      DEFAULT_FROM_EMAIL: ${ERRORS_FROM_EMAIL:?}
      EMAIL_URL: consolemail://
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      GLITCHTIP_RETENTION_DAYS: "90"
      PORT: "8000"
    networks:
      - errors
    deploy:
      resources:
        limits:
          memory: 512M

  glitchtip:
    image: docker.io/glitchtip/glitchtip:6.2.6
    container_name: factory-errors-glitchtip
    restart: unless-stopped
    command: ./bin/run-web.sh
    depends_on: &after-migrate
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment: *glitchtip-env
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      # A first start migrates the database, slower on rootless Docker: failures in this window do not count.
      start_period: 600s
    ports:
      - "127.0.0.1:${ERRORS_PORT:?}:8000"
    networks:
      - errors
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: docker.io/glitchtip/glitchtip:6.2.6
    container_name: factory-errors-worker
    restart: unless-stopped
    command: ./bin/run-worker.sh
    depends_on: *after-migrate
    environment: *glitchtip-env
    networks:
      - errors
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: docker.io/postgres:17.10
    container_name: factory-errors-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    environment:
      POSTGRES_PASSWORD: ${ERRORS_POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - factory-errors-postgres-data:/var/lib/postgresql/data
    networks:
      - errors
    deploy:
      resources:
        limits:
          memory: 512M

  valkey:
    image: docker.io/valkey/valkey:8.1.3
    container_name: factory-errors-valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - errors
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  errors: {}

volumes:
  factory-errors-postgres-data:
    name: factory-errors-postgres-data
