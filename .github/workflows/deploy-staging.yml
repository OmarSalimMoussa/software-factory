# Reusable: put one built and smoked commit on staging, one deploy at a time. Never prod: only promote.yml reaches it.
name: deploy-staging

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to put on staging, already built and smoked
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    # A deploy is never cancelled half way; the next one waits its turn.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Deploy staging
        env:
          SHA: ${{ inputs.sha }}
        run: scripts/ci/deploy-staging "$SHA"
