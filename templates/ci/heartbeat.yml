# The factory's prod heartbeat, copied unchanged into a product's .github/workflows/ beside ci.yml. Every five
# minutes, off the owner's laptop and off the server, it checks in with Healthchecks.io only after prod answers as
# prod. When the check-ins stop, Healthchecks.io tells the owner.
name: heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: factory.toml
          sparse-checkout-cone-mode: false
      - name: Prod answers as prod, then check in
        env:
          PING: ${{ secrets.HEALTHCHECKS_PROD_PING }}
        run: |
          test -n "$PING" || { echo "::error::the secret HEALTHCHECKS_PROD_PING is not set"; exit 1; }
          python3 - <<'PY'
          import json, tomllib, urllib.request
          with open("factory.toml", "rb") as f:
              settings = tomllib.load(f)
          url = f"https://{settings['workspaces']['prod']['domain']}{settings['deploy']['health']}"
          with urllib.request.urlopen(url, timeout=20) as reply:
              answer = json.load(reply)
          workspace = answer.get("workspace") if isinstance(answer, dict) else None
          if workspace != "prod":
              raise SystemExit(f"{url} answered as workspace {workspace!r}, not 'prod'")
          print(f"{url} answers as prod")
          PY
          curl -fsS -m 10 --retry 3 -o /dev/null "$PING"
