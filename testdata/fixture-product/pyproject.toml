[project]
name = "notes-fixture"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "The notes never reach the network"
type = "forbidden"
source_modules = ["app.notes"]
forbidden_modules = ["app.net"]
