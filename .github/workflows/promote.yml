# Reusable: redeploy prod at exactly the commit staging runs, using the product's ordinary deploy; nothing is built.
# Two locks hold it: it refuses any actor but the owner, and its job runs in the GitHub environment "prod", whose
# required reviewer is the owner (the factory's installer sets that), so GitHub asks the owner to approve every run.
# Going back (back: true) redeploys a commit prod ran before: one that is an ancestor of what prod runs now.
name: promote

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to put on prod
        required: true
        type: string
      back:
        description: Go back to a commit prod ran before, instead of forward to what staging runs
        required: false
        type: boolean
        default: false
      owner-login:
        description: The owner's GitHub login, the factory's repo.owner_login; nobody else may promote
        required: true
        type: string
      staging-health:
        description: Staging's health address; it answers JSON naming the running commit as build_commit
        required: true
        type: string
      prod-health:
        description: Prod's health address, with the same answer
        required: true
        type: string
      max-seconds:
        description: How long each health request may take
        required: true
        type: number

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    # One prod deploy at a time, never cancelled half way.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Only the owner promotes
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER_LOGIN: ${{ inputs.owner-login }}
        run: |
          if [ -z "$OWNER_LOGIN" ] || [ "$ACTOR" != "$OWNER_LOGIN" ] || [ "$TRIGGERING_ACTOR" != "$OWNER_LOGIN" ]; then
            echo "::error::only $OWNER_LOGIN promotes; this run was started by $TRIGGERING_ACTOR as $ACTOR"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: The commit is what staging runs, or one prod ran before
        env:
          SHA: ${{ inputs.sha }}
          BACK: ${{ inputs.back }}
          STAGING_HEALTH: ${{ inputs.staging-health }}
          PROD_HEALTH: ${{ inputs.prod-health }}
          MAX_SECONDS: ${{ inputs.max-seconds }}
        run: |
          set -euo pipefail
          build_commit() {
            curl -fsS -m "$MAX_SECONDS" "$1" | python3 -c 'import json, sys; print(json.load(sys.stdin)["build_commit"])'
          }
          wanted="$(git rev-parse --verify "$SHA^{commit}")"
          if [ "$BACK" = "true" ]; then
            on_prod="$(git rev-parse --verify "$(build_commit "$PROD_HEALTH")^{commit}")"
            if [ "$wanted" = "$on_prod" ] || ! git merge-base --is-ancestor "$wanted" "$on_prod"; then
              echo "::error::$wanted is not a commit prod ran before $on_prod"
              exit 1
            fi
          else
            on_staging="$(git rev-parse --verify "$(build_commit "$STAGING_HEALTH")^{commit}")"
            if [ "$wanted" != "$on_staging" ]; then
              echo "::error::staging runs $on_staging, not $wanted: only what staging runs goes to prod"
              exit 1
            fi
          fi
      - name: Promote
        env:
          SHA: ${{ inputs.sha }}
        run: scripts/ci/promote "$SHA"
